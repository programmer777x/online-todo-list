<!DOCTYPE html>
<html lang="en" data-theme="twilight">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Online To Do List — a fast, private, offline-capable to-do list.">
  
  <!-- PWA & Mobile Web App -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1a1040">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <title>Online To Do List</title>
  
  <!-- Styles -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/themes.css">
</head>
<body>
  <!-- Testing only: remove before merging to main -->
  <div id="build-version">v4</div>

  <div class="app-shell">

    <!-- ============================ HEADER ============================ -->
    <header class="app-header">
      <div class="app-brand">
        <span class="app-brand-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="none"
               stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 6l2 2 3-3"></path>
            <path d="M3 14l2 2 3-3"></path>
            <line x1="12" y1="7" x2="21" y2="7"></line>
            <line x1="12" y1="15" x2="21" y2="15"></line>
          </svg>
        </span>
        <h1 class="app-title">Online To Do List</h1>
      </div>

      <div class="app-header-controls">

        <!-- ---- List switcher ---- -->
        <div class="list-switcher" role="group" aria-label="Lists">
          <label class="visually-hidden" for="list-select">Active list</label>
          <select id="list-select" class="list-select" aria-label="Active list"></select>

          <button
            type="button"
            id="list-new-button"
            class="icon-button"
            aria-label="Create a new list"
            title="New list"
          >＋</button>

          <button
            type="button"
            id="list-rename-button"
            class="icon-button"
            aria-label="Rename the active list"
            title="Rename list"
          >✎</button>

          <button
            type="button"
            id="list-delete-button"
            class="icon-button icon-button-danger"
            aria-label="Delete the active list"
            title="Delete list"
          >🗑</button>
        </div>

        <!-- ---- Theme switcher ---- -->
        <label class="visually-hidden" for="theme-select">Theme</label>
        <select id="theme-select" class="theme-select" aria-label="Theme">
          <option value="twilight">Twilight Brand</option>
          <option value="terminal">Midnight Terminal</option>
          <option value="paper">Clean Paper</option>
          <option value="avocado">LuMi Avocado</option>
        </select>

      </div>
    </header>

    <!-- ============================ QUICK ADD ============================ -->
    <section class="quick-add" aria-label="Quick add">
      <input
        type="text"
        id="quick-add-input"
        class="quick-add-input"
        placeholder="Quick add… (lands in TO SORT)"
        autocomplete="off"
        aria-label="Quick add a task"
      >
      <button
        type="button"
        id="quick-add-button"
        class="quick-add-button"
        aria-label="Add task"
      >+</button>
    </section>

    <!-- ============================ SEARCH ============================ -->
    <section class="search-row" aria-label="Search">
      <label class="visually-hidden" for="search-input">Search tasks</label>
      <input
        type="search"
        id="search-input"
        class="search-input"
        placeholder="Search…"
        autocomplete="off"
        aria-label="Search tasks"
      >
      <button type="button" id="search-clear" class="search-clear" aria-label="Clear search" hidden>×</button>
    </section>

    <!-- ============================ SECTIONS ============================ -->
    <main id="sections" class="sections">

      <!-- URGENT -->
      <section class="task-section" data-section="urgent" aria-labelledby="section-urgent-title">
        <header class="task-section-header">
          <span class="task-section-icon" aria-hidden="true">🔥</span>
          <h2 class="task-section-title" id="section-urgent-title">URGENT</h2>
          <span class="task-section-count" data-count-for="urgent">0</span>
          <button
            type="button"
            class="task-section-add"
            data-add-to="urgent"
            aria-label="Add task to URGENT"
          >+</button>
        </header>
        <ul class="task-list" data-list-for="urgent"></ul>
      </section>

      <!-- TO DO -->
      <section class="task-section" data-section="todo" aria-labelledby="section-todo-title">
        <header class="task-section-header">
          <span class="task-section-icon" aria-hidden="true">📋</span>
          <h2 class="task-section-title" id="section-todo-title">TO DO</h2>
          <span class="task-section-count" data-count-for="todo">0</span>
          <button
            type="button"
            class="task-section-add"
            data-add-to="todo"
            aria-label="Add task to TO DO"
          >+</button>
        </header>
        <ul class="task-list" data-list-for="todo"></ul>
      </section>

      <!-- TO SORT -->
      <section class="task-section" data-section="sort" aria-labelledby="section-sort-title">
        <header class="task-section-header">
          <span class="task-section-icon" aria-hidden="true">🗂️</span>
          <h2 class="task-section-title" id="section-sort-title">TO SORT</h2>
          <span class="task-section-count" data-count-for="sort">0</span>
          <button
            type="button"
            class="task-section-add"
            data-add-to="sort"
            aria-label="Add task to TO SORT"
          >+</button>
        </header>
        <ul class="task-list" data-list-for="sort"></ul>
      </section>

    </main>

    <!-- ============================ PASTE BOX ============================ -->
    <section class="paste-box" aria-label="Paste tasks">
      <label class="paste-box-label" for="paste-input">Paste multiple tasks (one per line)</label>
      <textarea
        id="paste-input"
        class="paste-input"
        rows="4"
        placeholder="One task per line…"
        spellcheck="false"
      ></textarea>
      <div class="paste-box-actions">
        <button type="button" id="paste-add-button" class="button button-primary">Add pasted lines</button>
        <span id="paste-status" class="paste-status" role="status" aria-live="polite"></span>
      </div>
    </section>

    <!-- ============================ FOOTER ============================ -->
    <footer class="app-footer">
      <div class="footer-actions">
        <button type="button" id="export-button" class="button">Export active list (JSON)</button>
        <button type="button" id="import-button" class="button">Import as new list</button>
        <input type="file" id="import-file" accept="application/json,.json" hidden>
      </div>
      <p class="footer-note">Saved locally in your browser. No account, no server.</p>
    </footer>

  </div>

  <!-- Scripts: loaded as plain scripts (not modules) to preserve file:// compatibility.
       Order matters: Sortable -> config -> store -> render -> ui. -->
  <script src="js/Sortable.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/render.js"></script>
  <script src="js/ui.js"></script>

</body>
</html>
